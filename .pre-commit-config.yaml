minimum_pre_commit_version: "4.3.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and safe fixes
        entry: uv run --no-editable ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: Ruff format
        entry: uv run --no-editable ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: Mypy
        entry: uv run --no-editable mypy
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: unit-tests
        name: Fast unit tests
        entry: uv run --no-editable pytest -m not\ integration\ and\ not\ e2e\ and\ not\ live
        language: system
        pass_filenames: false
        stages: [pre-push]

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Deliberately blank. DATABASE_URL stays an environment setting with no
# committed secret (docs/adr/0002-postgres-pgvector.md section 14) --
# alembic/env.py reads the same DATABASE_URL the application does,
# through shared.config.DatabaseConfig.from_env(), and never falls back
# to a value written here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

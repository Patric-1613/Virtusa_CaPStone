[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-daily-digest"
version = "0.1.0"
description = "Evidence-backed AI industry updates with historical change tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6.0",
]

[dependency-groups]
dev = [
  "bandit[toml]>=1.8",
  "mypy>=1.18",
  "pip-audit>=2.9",
  "pre-commit>=4.3",
  "pylint>=3.3",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "pytest-xdist>=3.8",
  "ruff>=0.13",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_daily_digest"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data/raw", "data/processed"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "N",
  "RUF",
  "SIM",
  "UP",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["ai_daily_digest"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
show_error_codes = true
pretty = true
warn_unreachable = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=ai_daily_digest",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
testpaths = ["tests"]
markers = [
  "contract: shared-contract tests",
  "integration: tests that use a real infrastructure boundary",
  "e2e: end-to-end system tests",
  "live: opt-in tests against live external services",
]

[tool.coverage.run]
branch = true
source = ["ai_daily_digest"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.pylint.main]
py-version = "3.12"
jobs = 0
ignore-paths = ["^tests/fixtures/"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
  "duplicate-code",
  "fixme",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "too-few-public-methods",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
